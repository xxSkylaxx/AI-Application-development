    <style>
        body { font-family: 'Libre Baskerville', serif; background-color: #223C31; color: #DDDCCB; }
        .font-bitter-bold { font-family: 'Bitter', serif; font-weight: 700; }
        #map { width: 100%; height: 100%; z-index: 10; background-color: #303032; }
        
        /* Custom scrollbar matching earth tones */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #303032; }
        ::-webkit-scrollbar-thumb { background: #C2AA81; border-radius: 3px; }
        ::-webkit-scrollbar-thumb-hover { background: #804E2D; }

        /* Custom marker styling using earth tones */
        .custom-map-marker div {
            background-color: #576F3F !important;
            border: 2px solid #DDDCCB !important;
            color: #DDDCCB !important;
        }
        .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large {
            background-color: rgba(34, 60, 49, 0.8) !important;
        }
        .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div {
            background-color: #576F3F !important;
            color: #DDDCCB !important;
            font-weight: bold;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

                    </span>

                </div>

                <!-- State Filter -->

                        </select>

                            <i class="fa-solid fa-chevron-down"></i>
                        </span>
                    </div>
                    <button id="reset-filters" class="px-3 py-2 bg-[#303032] hover:bg-[#804E2D] text-[#DDDCCB] text-sm font-medium rounded-xl transition flex items-center gap-1 border border-[#303032]">
                        <i class="fa-solid fa-rotate-right text-xs text-[#C2AA81]"></i> Reset
                    </button>
                </div>
            </div>

                    <p class="text-sm">Loading national parks dataset...</p>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="flex-1 relative bg-[#303032]">

    </div>

                description: "Internationally recognized for its spectacular granite cliffs, waterfalls, clear streams, giant sequoia groves, and rich biological diversity."
            },
            {
                id: 63,
                name: "Zion",
                location: "Utah",
                lat: 37.30,
                lng: -113.05,
                dateEstablished: "November 19, 1919",
                area: "147,242.66 acres (595.9 km²)",
                visitors: 4622480,
                image: "https://media.zion.travel/cdn-cgi/image/width=1600,quality=80,format=auto,fit=cover/https://media.zion.travel/uploads/8f2405a9-d777-4f4a-a58e-4858266a39c2-zion-travel-west-temple-towers-of-the-virgin-best-.jpg",
                description: "A dramatic nature preserve distinguished by steep red sandstone cliffs, deep slot canyons like the Narrows, and hanging gardens along the Virgin River."
            }
        ];

        // Initialize Map centered on US
        const map = L.map('map', {
            zoomControl: false
        }).setView([39.8283, -98.5795], 4);

        // Add custom zoom control to top-right
        L.control.zoom({ position: 'topright' }).addTo(map);

        // Add OpenStreetMap tile layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Marker Cluster Group
        const markersCluster = L.markerClusterGroup({
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false,
            zoomToBoundsOnClick: true
        });
        map.addLayer(markersCluster);

        let markersMap = new Map(); // Park ID -> Marker

        // DOM Elements
        const parksListEl = document.getElementById('parks-list');
        const searchInputEl = document.getElementById('search-input');
        const stateFilterEl = document.getElementById('state-filter');
        const resetFiltersBtn = document.getElementById('reset-filters');
        const parkCountBadgeEl = document.getElementById('park-count-badge');
        const detailDrawerEl = document.getElementById('detail-drawer');
        const drawerContentEl = document.getElementById('drawer-content');
        const closeDrawerBtn = document.getElementById('close-drawer');
        const toggleSidebarMobileBtn = document.getElementById('toggle-sidebar-mobile');
        const closeSidebarBtn = document.getElementById('close-sidebar');
        const sidebarEl = document.getElementById('sidebar');
        const backdropEl = document.getElementById('backdrop');

        // Populate State Filter options
        function initStatesFilter() {
            const statesSet = new Set();
            parksData.forEach(park => {
                park.location.split(',').forEach(s => {
                    statesSet.add(s.trim());
                });
            });
            const sortedStates = Array.from(statesSet).sort();
            sortedStates.forEach(state => {
                const opt = document.createElement('option');
                opt.value = state;
                opt.textContent = state;
                stateFilterEl.appendChild(opt);
            });
        }

        // Render Parks
        function renderParks(filteredParks) {
            parksListEl.innerHTML = '';
            markersCluster.clearLayers();
            markersMap.clear();

            parkCountBadgeEl.textContent = `${filteredParks.length} Parks Found`;

            if (filteredParks.length === 0) {
                parksListEl.innerHTML = `
                    <div class="text-center py-12 text-[#C2AA81]">
                        <i class="fa-solid fa-mountain-sun text-3xl mb-2 opacity-50"></i>
                        <p class="text-sm">No national parks found matching your criteria.</p>
                    </div>
                `;
                return;
            }

            filteredParks.forEach(park => {
                // 1. Create List Card
                const card = document.createElement('div');
                card.className = "bg-[#303032]/80 hover:bg-[#303032] border border-[#223C31] hover:border-[#DFA237]/60 rounded-xl p-4 cursor-pointer transition shadow-sm group";
                card.innerHTML = `
                    <div class="flex items-start justify-between">
                        <h3 class="font-semibold text-[#DDDCCB] group-hover:text-[#DFA237] transition font-bitter-bold">${park.name} National Park</h3>
                        <span class="text-xs font-medium bg-[#223C31] text-[#C2AA81] px-2 py-0.5 rounded border border-[#303032]">${park.location}</span>
                    </div>
                    <p class="text-xs text-[#C2AA81]/80 mt-2 line-clamp-2">${park.description}</p>
                    <div class="mt-3 flex items-center justify-between text-xs text-[#C2AA81] pt-2 border-t border-[#223C31]">
                        <span><i class="fa-solid fa-users text-[#DFA237] mr-1"></i> ${park.visitors.toLocaleString()} visitors</span>
                        <span class="text-[#DFA237] font-medium group-hover:underline">Explore <i class="fa-solid fa-arrow-right text-[10px] ml-0.5"></i></span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    selectPark(park);
                    if (window.innerWidth < 768) {
                        toggleSidebar(false);
                    }
                });
                parksListEl.appendChild(card);

                // 2. Create Leaflet Marker with Custom Icon
                const customIcon = L.divIcon({
                    className: 'custom-map-marker',
                    html: `<div class="w-8 h-8 rounded-full bg-[#576F3F] text-[#DDDCCB] flex items-center justify-center shadow-lg border-2 border-[#DDDCCB] hover:scale-110 transition cursor-pointer"><i class="fa-solid fa-tree text-xs"></i></div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([park.lat, park.lng], { icon: customIcon });
                marker.on('click', () => {
                    selectPark(park);
                });
                
                markersCluster.addLayer(marker);
                markersMap.set(park.id, marker);
            });
        }

        // Select Park & Show Detail Drawer
        function selectPark(park) {
            map.flyTo([park.lat, park.lng], 9, {
                animate: true,
                duration: 1.2
            });

            drawerContentEl.innerHTML = `
                <img
                    src="${park.image}"
                    alt="${park.name}"
                    class="w-full h-56 object-cover rounded-xl"
                    onerror="this.style.display='none'"
                >
                <div>
                    <h2 class="text-2xl font-bold text-[#DDDCCB] font-bitter-bold">${park.name} National Park</h2>
                    <p class="text-sm text-[#DFA237] font-medium mt-1 flex items-center gap-1.5"><i class="fa-solid fa-location-dot"></i> ${park.location}</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-[#303032] p-3.5 rounded-xl border border-[#223C31]">
                        <span class="text-xs text-[#C2AA81] block"><i class="fa-solid fa-calendar-days text-[#DFA237] mr-1"></i> Established</span>
                        <span class="text-sm font-semibold text-[#DDDCCB] mt-1 block">${park.dateEstablished}</span>
                    </div>
                    <div class="bg-[#303032] p-3.5 rounded-xl border border-[#223C31]">
                        <span class="text-xs text-[#C2AA81] block"><i class="fa-solid fa-users text-[#DFA237] mr-1"></i> Annual Visitors</span>
                        <span class="text-sm font-semibold text-[#DDDCCB] mt-1 block">${park.visitors.toLocaleString()}</span>
                    </div>
                </div>

                <div class="bg-[#303032] p-3.5 rounded-xl border border-[#223C31]">
                    <span class="text-xs text-[#C2AA81] block"><i class="fa-solid fa-ruler-combined text-[#DFA237] mr-1"></i> Area Size</span>
                    <span class="text-sm font-semibold text-[#DDDCCB] mt-1 block">${park.area}</span>
                </div>

                <div>
                    <h3 class="text-sm font-semibold text-[#C2AA81] uppercase tracking-wider mb-2">About the Park</h3>
                    <p class="text-sm text-[#DDDCCB] leading-relaxed bg-[#303032] p-4 rounded-xl border border-[#223C31]">${park.description}</p>
                </div>

                <div class="pt-2">
                    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(park.name + ' National Park ' + park.location)}" target="_blank" class="w-full bg-[#576F3F] hover:bg-[#804E2D] text-[#DDDCCB] font-medium py-3 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                        <i class="fa-solid fa-map-location-dot"></i> Open in Google Maps
                    </a>
                </div>
            `;

            detailDrawerEl.classList.remove('translate-x-full');
        }

        // Filter logic
        function filterParks() {
            const query = searchInputEl.value.toLowerCase().trim();
            const selectedState = stateFilterEl.value;

            const filtered = parksData.filter(park => {
                const matchesQuery = park.name.toLowerCase().includes(query) || 
                                     park.description.toLowerCase().includes(query) ||
                                     park.location.toLowerCase().includes(query);
                const matchesState = selectedState === "" || park.location.includes(selectedState);
                return matchesQuery && matchesState;
            });

            renderParks(filtered);
        }

        searchInputEl.addEventListener('input', filterParks);
        stateFilterEl.addEventListener('change', filterParks);
        resetFiltersBtn.addEventListener('click', () => {
            searchInputEl.value = '';
            stateFilterEl.value = '';
            filterParks();
        });

        // Mobile Sidebar Toggle
        function toggleSidebar(show) {
            if (show) {
                sidebarEl.classList.remove('-translate-x-full');
                backdropEl.classList.remove('hidden');
            } else {
                sidebarEl.classList.add('-translate-x-full');
                backdropEl.classList.add('hidden');
            }
        }

        toggleSidebarMobileBtn.addEventListener('click', () => toggleSidebar(true));
        closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
        backdropEl.addEventListener('click', () => toggleSidebar(false));

        closeDrawerBtn.addEventListener('click', () => {
            detailDrawerEl.classList.add('translate-x-full');
        });

        window.onload = function () {
            initStatesFilter();
            renderParks(parksData);
        };
    </script>
</body>
</html>
